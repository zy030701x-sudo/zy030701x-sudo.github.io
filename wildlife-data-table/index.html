<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wildlife Data Table</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <main class="container py-5">
        <h1>Australian Wildlife</h1>

        <div class="mb-3">
            <label for="animal-type">Animal type</label>
        
            <select id="animal-type">
                <option value="All">All</option>
                <option value="Mammal">Mammal</option>
                <option value="Bird">Bird</option>
                <option value="Reptile">Reptile</option>
            </select>
        
            <button type="button" id="btn-filter" class="btn btn-primary">
                Filter
            </button>
        </div>

        <div class="table-responsive">
            <table id="wildlife-table" class="table table-striped">
                <thead>
                    <tr>
                        <th scope="col">Name</th>
                        <th scope="col">Habitat</th>
                        <th scope="col">Diet</th>
                        <th scope="col">Type</th>
                    </tr>
                </thead>

                <tbody></tbody>
            </table>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
